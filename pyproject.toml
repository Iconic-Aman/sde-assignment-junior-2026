[project]
name = "interaction-ledger"
version = "0.1.0"
description = "Interaction ledger pipeline"
requires-python = ">=3.10"
dependencies = [
    "cryptography>=42.0",
    "fastapi>=0.110",
    "httpx>=0.27",
    "pydantic>=2.0",
    "pytest>=8.0",
    "python-dotenv>=1.0.0",
    "uvicorn>=0.29",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["solution"]
testpaths = ["solution/tests"]
